# The self-contained single-box topology, with every memory cap written down.
#
#   docker compose -f compose.prod.yaml up -d
#
# ## This is NOT how the shared platform deploys it — read this first
#
# `~/projects/INFRA.md` describes the platform these projects actually deploy
# onto, and its conventions differ from this file in three ways on purpose:
#
#  | Here                                   | Shared platform                              |
#  | -------------------------------------- | -------------------------------------------- |
#  | own `postgres` container               | a **database** on the shared PostgreSQL server |
#  | Caddy with public `80/443` + ACME      | **Cloudflare Tunnel** — no open inbound ports  |
#  | Caddy serves the SPA from `/srv/web`   | **Cloudflare Pages** serves the SPA            |
#
# So why does this file exist at all?
#
#  1. **Phase 10's break-point test needs a stack whose limits are fixed and
#     published in advance.** A ceiling measured against a shared box is a
#     measurement of the neighbours as much as of this service.
#  2. It is the reproducible deployment for anyone cloning the repo, who has
#     neither a shared PostgreSQL server nor a Cloudflare account.
#
# Do not read this file as the deployment plan — it is the standalone and benchmark one.
#
# ## The caps are the point of this file
#
# Phase 10 loads this stack to its breaking point, and that measurement is only
# meaningful if the limits were fixed and published **beforehand**. A break-point
# number from an unbounded stack is a number about the host, not about the
# deployment.
#
# Sized for a 4 GB / 2 vCPU box, which is the target:
#
#   postgres   2048 MB  (shared_buffers 512 MB + work_mem x connections + OS cache)
#   api         512 MB  (V8 heap capped at 384 MB — see the Dockerfile)
#   caddy       128 MB
#   ------------------
#   total      2688 MB, leaving ~1.3 GB for the kernel, page cache and headroom
#
# Deliberately **not** allocating the whole box. PostgreSQL relies on the OS page
# cache for everything outside `shared_buffers`, so a container layout that sums
# to the machine's RAM starves the cache and turns buffered reads into disk
# reads — the slowdown shows up as database latency and is invisible in any
# per-container memory metric.
#
# ## What is not here
#
# No Prometheus, Alertmanager or Jaeger. On a 4 GB box the observability stack
# from `compose.observability.yaml` needs about 1.5 GB with its own caps, which
# does not fit alongside this. The alternative is to ship metrics off-box.

name: daftar-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daftar
      # `daftar` is the measured benchmark stack; an exchange deployment sets
      # DAFTAR_DB_NAME=daftar_exchange so it never shares the seeded dataset.
      POSTGRES_DB: ${DAFTAR_DB_NAME:-daftar}
      # From a file, never inline and never from the host environment. A
      # `POSTGRES_PASSWORD` in compose is visible in `docker inspect`, in the
      # process list, and in anyone's shell history.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    secrets:
      - db_password
    # No `ports:`. The database is reachable only over the compose network —
    # publishing 5432 even on loopback invites an SSH tunnel to become a
    # production access path.
    expose:
      - '5432'
    command:
      - postgres
      # Tuned for 4 GB, and deliberately more conservative than compose.yaml's
      # dev settings.
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      # 50, not 100. The arithmetic that has to hold:
      #   (api instances x DB_POOL_MAX) + superuser_reserved <= max_connections
      #   (1 x 20) + 3 = 23, which leaves room for a migration and a psql.
      - -c
      - max_connections=50
      # 2 vCPU, so one I/O worker. The default of 3 oversubscribes a 2-core box
      # and the workers compete with the backends they are serving.
      - -c
      - io_workers=1
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      # WAL archiving, which is what makes point-in-time recovery possible.
      # `archive_command` is a plain `cp` to a mounted volume here; the real
      # off-box shipping is a separate concern, and the restore exercise is
      # scripts/wal-restore-drill.sh.
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - archive_timeout=300
    volumes:
      # PostgreSQL 18 stores data in a major-version subdirectory, so the mount
      # belongs at /var/lib/postgresql and NOT /var/lib/postgresql/data —
      # mounting the old path makes the container refuse to start.
      - db-data:/var/lib/postgresql
      - wal-archive:/wal-archive
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daftar -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2048m
    # `mem_reservation` as well as `mem_limit`: under host pressure the kernel
    # reclaims from containers above their reservation first, and the database
    # is the last thing that should be squeezed.
    mem_reservation: 1024m

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # Service name, not an IP. Compose's DNS resolves it, and it survives the
      # database container being recreated with a different address.
      DATABASE_URL: postgres://daftar:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DAFTAR_DB_NAME:-daftar}
      # 20 against max_connections=50. See the arithmetic above.
      DB_POOL_MAX: '20'
      LOG_LEVEL: info
      LOG_PRETTY: 'false'
      LEDGER_CONCURRENCY_MODE: advisory
      # Flag headers OFF. An unauthenticated header that selects a deliberately
      # broken ledger path must not be reachable in production — `env.ts`
      # already defaults it off here, and it is stated explicitly so that a
      # future edit has to argue with a visible value.
      ALLOW_FLAG_HEADERS: 'false'
      DAFTAR_NAIVE_OVERDRAFT: 'false'
      DAFTAR_NAIVE_LOST_UPDATE: 'false'
      DAFTAR_NAIVE_IDEMPOTENCY: 'false'
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET is required}
      CHAOS_TOKEN_SECRET: ${CHAOS_TOKEN_SECRET:?CHAOS_TOKEN_SECRET is required}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?GUEST_SESSION_SECRET is required}
      # Off unless asked for: the bots write ledger entries continuously, and
      # the memory caps above were published for a box that is not running them.
      EXCHANGE_BOTS_ENABLED: ${EXCHANGE_BOTS_ENABLED:-false}
      # Off unless asked for, like the bots. One instance only.
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-false}
      # Live push needs the broker; with it off the stream answers 503 and the
      # client polls, as before.
      LIVE_PUSH_ENABLED: ${LIVE_PUSH_ENABLED:-false}
      # Unset = the admin routes answer 404. Set from a secret store, >= 24 chars.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # The unauthenticated legacy API. Off in production unless asked for.
      LEGACY_API_ENABLED: ${LEGACY_API_ENABLED:-false}
      KAFKA_BROKERS: kafka:9092
      # Tracing off, as it is everywhere. The SDK is the component most likely
      # to leak memory here and there is no collector on this box to send to.
      OTEL_ENABLED: 'false'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    expose:
      - '3000'
    # 512 MB against the Dockerfile's 384 MB V8 heap cap — about 70%, leaving
    # room for the pg driver's buffers, `external` memory and thread stacks,
    # which the heap limit does not cover.
    mem_limit: 512m
    mem_reservation: 256m

  # One-shot: apply migrations, then exit. Never on boot (see the Dockerfile).
  #   docker compose -f compose.prod.yaml --profile ops run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['ops']
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'apps/api/dist/db/migrate.js']
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://daftar:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DAFTAR_DB_NAME:-daftar}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET is required}
      CHAOS_TOKEN_SECRET: ${CHAOS_TOKEN_SECRET:?CHAOS_TOKEN_SECRET is required}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?GUEST_SESSION_SECRET is required}
    restart: 'no'

  # The worker process: outbox relay, event-log consumers, BullMQ workers.
  # Same image as the API, different entrypoint. Every component is opt-in.
  workers:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command:
      ['node', '--max-old-space-size=256', '--max-semi-space-size=16', 'apps/api/dist/workers.js']
    # The API's healthcheck probes :3000, which this process does not serve.
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://daftar:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DAFTAR_DB_NAME:-daftar}
      WORKERS_DB_POOL_MAX: '8'
      LOG_LEVEL: info
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://valkey:6379
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET is required}
      CHAOS_TOKEN_SECRET: ${CHAOS_TOKEN_SECRET:?CHAOS_TOKEN_SECRET is required}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?GUEST_SESSION_SECRET is required}
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-false}
      OUTBOX_PUBLISHER: ${OUTBOX_PUBLISHER:-kafka}
      CONSUMERS_ENABLED: ${CONSUMERS_ENABLED:-false}
      JOBS_ENABLED: ${JOBS_ENABLED:-false}
      MARKET_TICKER_ENABLED: ${MARKET_TICKER_ENABLED:-false}
      OTEL_ENABLED: 'false'
    # 384 MB against a 256 MB heap: consumers buffer at most 64 messages each.
    mem_limit: 384m
    mem_reservation: 192m

  # The event log: Apache Kafka, one combined broker + KRaft controller. See
  # compose.yaml for why each setting is there; this differs only in having no
  # host-facing listener. Default flushing (acked from the page cache).
  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    restart: unless-stopped
    environment:
      # Not a secret. Changing it on an existing volume stops the broker.
      CLUSTER_ID: iYib_p83Rqym_0Huq_v1xQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 4
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 33554432
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    expose:
      - '9092'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'KAFKA_HEAP_OPTS="-Xmx64m -Xms16m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null',
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
      start_interval: 5s
    volumes:
      - kafka-data:/var/lib/kafka/data
    # 512 MB fixed heap + an estimated 150–250 MB outside it + the healthcheck
    # JVM's transient ~100–150 MB. Estimates until measured with
    # `docker stats`; box sizing is redone from that measurement.
    mem_limit: 1g
    mem_reservation: 768m

  valkey:
    image: valkey/valkey:9.2.0-alpine
    restart: unless-stopped
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - valkey-data:/data
    # maxmemory 256 MB of data; AOF rewrite forks, so the cap allows for a
    # copy-on-write second image.
    mem_limit: 512m
    mem_reservation: 256m

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
      # QUIC. Same port as HTTPS but UDP, and it has to be published
      # separately — omitting it means HTTP/3 advertises itself via Alt-Svc and
      # then fails to connect, which is slower than not offering it at all.
      - '443:443/udp'
    environment:
      DAFTAR_DOMAIN: ${DAFTAR_DOMAIN:?DAFTAR_DOMAIN is required}
      # Go's soft memory limit, at ~85% of the container cap. Without it the Go
      # runtime sizes its heap target from the host's memory and the container
      # is OOM-killed before the garbage collector reacts — the same class of
      # bug as Node's default heap limit, in a different runtime.
      GOMEMLIMIT: 108MiB
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The SPA's static output, served from the same origin as the API so a
      # relative `/v1/...` fetch works unchanged and there is no CORS.
      - ./apps/web/dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

secrets:
  db_password:
    # A file on the host, mode 600, outside the repo. Not a compose
    # `environment:` value and not committed anywhere.
    file: ./deploy/secrets/db_password

volumes:
  db-data:
  wal-archive:
  caddy-data:
  caddy-config:
  kafka-data:
  valkey-data:
