# Local development + test database.
#
# postgres:18-alpine, not PGlite. PGlite compiles PostgreSQL to WASM and runs it
# single-user, holding an exclusive mutex per transaction, so two transactions are
# never in flight at once — it silently passes the exact check-then-write bugs this
# repo exists to demonstrate. See CONVENTIONS.md.

name: daftar

services:
  db:
    image: postgres:18-alpine
    container_name: daftar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: daftar
      POSTGRES_PASSWORD: daftar
      POSTGRES_DB: daftar
      # Deterministic collation so ORDER BY on text is stable across machines.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8'
    ports:
      # Bound to loopback only. Never publish a database on 0.0.0.0.
      - '127.0.0.1:55432:5432'
    command:
      - postgres
      # Dev-box tuning. The Phase 6 / Phase 10 benchmark numbers come from a
      # separate, explicitly documented configuration — do not read these as the
      # benchmark settings.
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      # PostgreSQL 18 defaults to io_method=worker with io_workers=3. Left at the
      # default on purpose: this box has 16 vCPU and pinning io_workers=1 would
      # throttle the async I/O path the benchmarks are meant to exercise.
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daftar -d daftar']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
