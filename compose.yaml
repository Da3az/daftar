# Local development + test database.
#
# postgres:18-alpine, not PGlite. PGlite compiles PostgreSQL to WASM and runs it
# single-user, holding an exclusive mutex per transaction, so two transactions are
# never in flight at once — it silently passes the exact check-then-write bugs this
# repo exists to demonstrate. See CONVENTIONS.md.

name: daftar

services:
  db:
    image: postgres:18-alpine
    container_name: daftar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: daftar
      POSTGRES_PASSWORD: daftar
      POSTGRES_DB: daftar
      # C collation: byte ordering, deterministic, and independent of the ICU
      # version the image happens to ship. A benchmark whose text ordering can
      # change under it on a base-image bump is not reproducible. Nothing in the
      # ledger orders by text — entries order by (created_at, id) — so there is
      # no linguistic-collation requirement to trade away.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Bound to loopback only. Never publish a database on 0.0.0.0.
      - '127.0.0.1:55432:5432'
    command:
      - postgres
      # Dev-box tuning. The Phase 6 / Phase 10 benchmark numbers come from a
      # separate, explicitly documented configuration — do not read these as the
      # benchmark settings.
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      # PostgreSQL 18 defaults to io_method=worker with io_workers=3. Left at the
      # default on purpose: this box has 16 vCPU and pinning io_workers=1 would
      # throttle the async I/O path the benchmarks are meant to exercise.
      # Pinned so timestamptz output always carries a +00 offset. The driver
      # keeps timestamps as exact strings (see src/db/timestamps.ts) and
      # normalises them to RFC 3339; a server in a local zone would still be
      # correct, but every evidence file would carry a different offset.
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daftar -d daftar']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      # PostgreSQL 18's official image changed this. The mount belongs at
      # /var/lib/postgresql, NOT /var/lib/postgresql/data: from 18 the image
      # stores data in a major-version-specific subdirectory so that
      # `pg_upgrade --link` can see both versions without crossing a mount
      # boundary. Mounting the old path makes the container refuse to start with
      # "there appears to be PostgreSQL data in /var/lib/postgresql/data
      # (unused mount/volume)".
      - db-data:/var/lib/postgresql

  # The event log. PostgreSQL's outbox stays the source of truth; this is the
  # relay's destination and the projections' replay source.
  #
  # Apache Kafka (Apache 2.0), one node acting as both broker and KRaft
  # controller. 4.2.x because 4.2 is the newest Kafka the client
  # (@platformatic/kafka) runs its CI against — Confluent Platform 8.2, which
  # ships Apache Kafka 4.2. Redpanda before it: see docs/infrastructure.md.
  #
  # The image builds server.properties from KAFKA_* variables (`.` → `_`), and
  # when any are set it does NOT start from its bundled defaults — so every
  # required property is spelled out below, including the replication factors
  # that default to 3 and would stop a single node from creating the
  # consumer-offsets topic (no consumer groups at all).
  #
  # Durability: Kafka's default flushing, deliberately. A write is acked once
  # it is in the page cache; a broker *process* crash loses nothing, a *host*
  # crash or power cut can lose the last few seconds of acked events. See
  # docs/infrastructure.md, "Event log durability".
  kafka:
    image: apache/kafka:4.2.2
    container_name: daftar-kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      # Generated once for this file. Not a secret; changing it on an existing
      # volume makes the broker refuse to start.
      CLUSTER_ID: iYib_p83Rqym_0Huq_v1xQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      # EXTERNAL is for clients on the host and is only published on loopback.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One node: every internal topic must be replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Topics come from `npm run kafka:topics`, never from a client: a typo'd
      # topic name must fail, and visitors must never cause topic creation.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # 50 offsets partitions (the default) is 50 sets of segment and index
      # files for five consumer groups.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 4
      # 16 MiB segments instead of 1 GiB. Retention deletes whole closed
      # segments, so at 1 GiB the one-day market topic would hold up to 1 GiB
      # before anything left disk or page cache; at 16 MiB the short-retention
      # topics stay short and leave PostgreSQL the cache. Per-topic retention
      # is set by `kafka:topics` (events.v1 is kept forever).
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      # The log cleaner's dedupe map is a heap buffer (128 MiB by default, a
      # quarter of the heap below). Only __consumer_offsets is compacted here.
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 33554432
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Fixed heap: -Xms = -Xmx, so the heap never resizes. Committed is not
      # resident: Linux backs heap pages only once they are touched, so
      # `docker stats` starts well below 512 MB and climbs as the heap fills
      # (measured 2026-11-25: ~350 MiB after a few minutes of light load).
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    ports:
      - '127.0.0.1:19092:19092'
    # Proves the broker answers a Kafka request (ApiVersions), not just that
    # the JVM is up. The probe is a second JVM in the same container, so it
    # gets its own small heap — the container's KAFKA_HEAP_OPTS would give it
    # 512 MB — and runs every 30 s, not every few seconds. It still costs more
    # than its 64 MB heap (metaspace, code cache, threads), for a second or
    # two per run; that is counted in mem_limit below.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'KAFKA_HEAP_OPTS="-Xmx64m -Xms16m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null',
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
      start_interval: 5s
    volumes:
      - kafka-data:/var/lib/kafka/data
    # 512 MB heap + roughly 150–250 MB outside it (metaspace, code cache,
    # thread stacks, NIO buffers) + the healthcheck JVM's transient
    # ~100–150 MB. Those two non-heap figures are estimates, not measurements
    # — `docker stats` during a bot run is what confirms or moves them. Page
    # cache from segment writes is charged to this cgroup too, but the kernel
    # reclaims it before the limit bites.
    mem_limit: 1g
    mem_reservation: 768m

  # The job queue's store. BullMQ's production requirements, each of which
  # fails silently if missed:
  #
  # - `noeviction`: any other policy lets Valkey delete queue keys under
  #   memory pressure — jobs vanish with no error anywhere.
  # - AOF on: an RDB snapshot alone loses everything since the last one.
  #   `everysec` loses up to ~1 s of writes on a crash, which is why nothing in
  #   this system relies on Valkey for a guarantee — Postgres sweepers re-enqueue
  #   anything a lost job would have done.
  valkey:
    image: valkey/valkey:9.2.0-alpine
    container_name: daftar-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - valkey-data:/data

  # Optional UI for the event log: topics, message bodies and headers,
  # consumer-group lag. Dev only, loopback only, never deployed.
  # kafbat kafka-ui (Apache 2.0), read-only: inspecting must not be able to
  # reset an offset or delete a topic by a mis-click.
  #   docker compose --profile console up -d kafka-ui
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    container_name: daftar-kafka-ui
    profiles: ['console']
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: daftar
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: 'true'
    ports:
      - '127.0.0.1:18080:8080'

volumes:
  db-data:
  kafka-data:
  valkey-data:
